
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Shelf | Bookshop</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">

        <header class="header">
            <p class="tag">BOOKSHOP · LAB 06</p>
            <h1>📚 The Shelf</h1>
            <p>Your little corner of books and essentials.</p>
        </header>

        <section class="panel">
            <div class="section-heading">
                <div>
                    <h2>Price Board</h2>
                    <p>Load the latest prices from the server.</p>
                </div>

                <button id="loadBtn">Load Prices</button>
            </div>

            <p id="message" role="status">Ready to load prices.</p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody id="priceList"></tbody>
                </table>
            </div>
        </section>

        <section class="stats">
            <article class="stat">
                <p>Loaded</p>
                <h2 id="loaded">0</h2>
                <span>Items available</span>
            </article>

            <article class="stat">
                <p>Dearest</p>
                <h2 id="dearest">0</h2>
                <span>Highest price</span>
            </article>

            <article class="stat">
                <p>Sum</p>
                <h2 id="sum">0</h2>
                <span>Total of prices</span>
            </article>
        </section>

        <footer>Made for Lab 06 · The Shelf</footer>

    </main>
</body>
</html>
